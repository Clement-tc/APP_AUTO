apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: offreapi
  labels:
    name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'flask-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['offre-api:5000']
